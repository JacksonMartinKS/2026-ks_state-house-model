<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>District Forecast Dashboard</title>
  <style>
    :root {
      --bg: #ffffff;
      --card-bg: #f8fafc;
      --border: #e2e8f0;
      --text: #0f172a;
      --text-muted: #64748b;
      --dem: #2563eb;
      --rep: #dc2626;
      --ind: #16a34a;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      margin: 0;
      padding: 16px;
      background: var(--bg);
      color: var(--text);
    }
    .container {
      max-width: 540px;
      margin: 0 auto;
    }
    label {
      font-size: 0.85rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-muted);
      display: block;
      margin-bottom: 6px;
    }
    select {
      width: 100%;
      padding: 10px 12px;
      font-size: 1rem;
      border: 1px solid var(--border);
      border-radius: 8px;
      background-color: #fff;
      cursor: pointer;
      margin-bottom: 16px;
    }
    .card {
      border: 1px solid var(--border);
      border-radius: 10px;
      background: var(--card-bg);
      padding: 16px;
    }
    .header-row {
      border-bottom: 1px solid var(--border);
      padding-bottom: 12px;
      margin-bottom: 12px;
    }
    .district-title {
      font-size: 1.25rem;
      font-weight: 700;
      margin: 0 0 4px 0;
    }
    .candidates {
      font-size: 0.95rem;
      color: var(--text-muted);
    }
    .stat-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 16px;
    }
    .stat-box {
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 10px;
    }
    .stat-label {
      font-size: 0.75rem;
      color: var(--text-muted);
      text-transform: uppercase;
      display: block;
      margin-bottom: 4px;
    }
    .stat-val {
      font-size: 0.95rem;
      font-weight: 600;
    }
    .forecast-banner {
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 12px;
      text-align: center;
    }
    .forecast-title {
      font-size: 0.8rem;
      color: var(--text-muted);
      text-transform: uppercase;
      margin-bottom: 4px;
    }
    .forecast-stats {
      font-size: 1.05rem;
      font-weight: 700;
    }
  </style>
</head>
<body>

<div class="container">
  <label for="districtSelect">Select District</label>
  <select id="districtSelect">
    <option value="" disabled selected>-- Choose a district --</option>
  </select>

  <div id="districtCard" class="card" style="display: none;">
    <div class="header-row">
      <div id="outDistrict" class="district-title"></div>
      <div id="outCandidates" class="candidates"></div>
    </div>

    <div class="stat-grid">
      <div class="stat-box">
        <span class="stat-label">Baseline Partisanship</span>
        <span id="outPartisanship" class="stat-val"></span>
      </div>
      <div class="stat-box">
        <span class="stat-label">Generic Ballot</span>
        <span id="outGenericBallot" class="stat-val"></span>
      </div>
      <div class="stat-box">
        <span class="stat-label">Incumbency Bonus</span>
        <span id="outIncumbency" class="stat-val"></span>
      </div>
      <div class="stat-box">
        <span class="stat-label">Candidate Performance</span>
        <span id="outCandidatePerf" class="stat-val"></span>
      </div>
      <div class="stat-box" style="grid-column: span 2;">
        <span class="stat-label">Campaign Finance</span>
        <span id="outFinance" class="stat-val"></span>
      </div>
    </div>

    <div class="forecast-banner">
      <div class="forecast-title">Model Projection</div>
      <div id="outForecast" class="forecast-stats"></div>
    </div>
  </div>
</div>

<script>
  function parseCSV(text) {
    const lines = text.trim().split('\n');
    const headers = lines[0].split(',').map(h => h.trim());
    return lines.slice(1).map(line => {
      // Regex handles values with commas if quoted
      const values = line.match(/(".*?"|[^",\s]+)(?=\s*,|\s*$)/g) || line.split(',');
      const entry = {};
      headers.forEach((h, i) => {
        entry[h] = values[i] ? values[i].replace(/^"|"$/g, '').trim() : '';
      });
      return entry;
    });
  }

  const rawCSV = document.getElementById('csvData').textContent;
  const records = parseCSV(rawCSV);
  const select = document.getElementById('districtSelect');
  const card = document.getElementById('districtCard');

  records.forEach((row, idx) => {
    if (row.District) {
      const opt = document.createElement('option');
      opt.value = idx;
      opt.textContent = row.District;
      select.appendChild(opt);
    }
  });

  select.addEventListener('change', (e) => {
    const d = records[e.target.value];
    if (!d) return;

    document.getElementById('outDistrict').textContent = d.District;
    document.getElementById('outCandidates').textContent = `${d.DemCandidate} vs. ${d.RepCandidate}`;
    document.getElementById('outPartisanship').textContent = d.BaselinePartisanship;
    document.getElementById('outGenericBallot').textContent = d.GenericBallot;
    document.getElementById('outIncumbency').textContent = d.IncumbencyBonus;
    document.getElementById('outCandidatePerf').textContent = d.CandidatePerf;
    document.getElementById('outFinance').textContent = d.Finance;
    document.getElementById('outForecast').textContent = 
      `Margin: ${d.PredictedMargin} | ±${d.STDEV} STDEV | ${d.DemWinChance} Win Prob`;

    card.style.display = 'block';
  });
</script>
