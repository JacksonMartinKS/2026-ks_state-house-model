<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>District Forecast Dashboard</title>
  <style>
    :root {
      --bg: #ffffff;
      --card-bg: #f8fafc;
      --border: #e2e8f0;
      --border-dark: #94a3b8;
      --text: #0f172a;
      --text-muted: #64748b;
      --dem: #1d4ed8;
      --rep: #dc2626;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      margin: 0;
      padding: 16px;
      background: var(--bg);
      color: var(--text);
    }
    .container {
      max-width: 480px;
      margin: 0 auto;
    }
    label {
      font-size: 0.8rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-muted);
      display: block;
      margin-bottom: 6px;
    }
    select {
      width: 100%;
      padding: 10px 12px;
      font-size: 1rem;
      border: 1px solid var(--border);
      border-radius: 8px;
      background-color: #fff;
      cursor: pointer;
      margin-bottom: 16px;
      outline: none;
    }
    select:focus {
      border-color: #3b82f6;
    }
    .card {
      border: 1px solid var(--border);
      border-radius: 12px;
      background: var(--card-bg);
      padding: 18px;
    }
    .header-row {
      border-bottom: 1px solid var(--border);
      padding-bottom: 12px;
      margin-bottom: 14px;
    }
    .district-title {
      font-size: 1.3rem;
      font-weight: 800;
      margin: 0 0 4px 0;
    }
    .candidates {
      font-size: 0.95rem;
      color: var(--text-muted);
    }
    
    /* Vertical Math Stack */
    .stack-container {
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-bottom: 16px;
    }
    .stack-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 4px 0;
      font-size: 0.9rem;
    }
    .stack-row.baseline {
      font-size: 1rem;
      font-weight: 800;
      padding-bottom: 8px;
      border-bottom: 1px dashed var(--border);
      margin-bottom: 4px;
    }
    .stack-row.component {
      color: #334155;
    }
    .val-d { color: var(--dem); font-weight: 700; }
    .val-r { color: var(--rep); font-weight: 700; }
    .val-neutral { color: var(--text-muted); font-weight: 600; }

    /* Summary / Projection Area */
    .result-section {
      border-top: 2px solid var(--border-dark);
      padding-top: 12px;
      margin-top: 4px;
    }
    .result-row {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      margin-bottom: 8px;
    }
    .result-title {
      font-size: 1rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }
    .result-margin {
      font-size: 1.25rem;
      font-weight: 900;
    }
    .meta-metrics {
      display: flex;
      justify-content: space-between;
      background: #ffffff;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px 14px;
      font-size: 0.85rem;
    }
    .meta-item {
      display: flex;
      flex-direction: column;
    }
    .meta-label {
      color: var(--text-muted);
      font-size: 0.72rem;
      text-transform: uppercase;
      margin-bottom: 2px;
      font-weight: 600;
    }
    .meta-val {
      font-size: 0.95rem;
      font-weight: 700;
    }
  </style>
</head>
<body>

<div class="container">
  <label for="districtSelect">Select Legislative District</label>
  <select id="districtSelect">
    <option value="" disabled selected>-- Choose a district --</option>
  </select>

  <div id="districtCard" class="card" style="display: none;">
    <div class="header-row">
      <div id="outDistrict" class="district-title"></div>
      <div id="outCandidates" class="candidates"></div>
    </div>

    <!-- Stacked Addition Layout -->
    <div class="stack-container">
      <div class="stack-row baseline">
        <span>Baseline Partisanship</span>
        <span id="outPartisanship"></span>
      </div>
      <div class="stack-row component">
        <span>+ Generic Ballot Shift</span>
        <span id="outGeneric"></span>
      </div>
      <div class="stack-row component">
        <span>+ Incumbency Effect</span>
        <span id="outIncumbency"></span>
      </div>
      <div class="stack-row component">
        <span>+ Candidate Quality / Perf</span>
        <span id="outCandidatePerf"></span>
      </div>
      <div class="stack-row component">
        <span>+ Campaign Finance Effect</span>
        <span id="outFinance"></span>
      </div>
    </div>

    <!-- Final Forecast Output -->
    <div class="result-section">
      <div class="result-row">
        <span class="result-title">Predicted Margin</span>
        <span id="outMargin" class="result-margin"></span>
      </div>
      <div class="meta-metrics">
        <div class="meta-item">
          <span class="meta-label">Model STDEV</span>
          <span id="outStdev" class="meta-val"></span>
        </div>
        <div class="meta-item" style="text-align: right;">
          <span class="meta-label">Dem Win Probability</span>
          <span id="outWinProb" class="meta-val"></span>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
  // Converts negative to D+ and positive to R+ with 1 decimal place
  function formatPartisan(valStr) {
    const num = parseFloat(valStr);
    if (isNaN(num) || Math.abs(num) < 0.00005) {
      return { text: 'EVEN', cls: 'val-neutral' };
    }
    const pts = Math.abs(num * 100).toFixed(1);
    if (num < 0) {
      return { text: `D+${pts}`, cls: 'val-d' };
    } else {
      return { text: `R+${pts}`, cls: 'val-r' };
    }
  }

  function parseInput(text) {
    const lines = text.trim().split('\n');
    return lines.map(line => {
      const cols = line.split(',').map(c => c.trim());
      if (cols.length < 11) return null;
      return {
        district: cols[0],
        demCandidate: cols[1],
        repCandidate: cols[2],
        baseline: cols[3],
        generic: cols[4],
        incumbency: cols[5],
        candidatePerf: cols[6],
        finance: cols[7],
        margin: cols[8],
        stdev: cols[9],
        winChance: cols[10]
      };
    }).filter(Boolean);
  }

  const raw = document.getElementById('rawInputData').textContent;
  const records = parseInput(raw);
  const select = document.getElementById('districtSelect');
  const card = document.getElementById('districtCard');

  // Populate Dropdown
  records.forEach((row, idx) => {
    const opt = document.createElement('option');
    opt.value = idx;
    opt.textContent = `${row.district} (${row.demCandidate} vs ${row.repCandidate})`;
    select.appendChild(opt);
  });

  function applyFormat(elemId, rawVal) {
    const elem = document.getElementById(elemId);
    const res = formatPartisan(rawVal);
    elem.textContent = res.text;
    elem.className = res.cls;
  }

  select.addEventListener('change', (e) => {
    const d = records[e.target.value];
    if (!d) return;

    // Header info
    document.getElementById('outDistrict').textContent = d.district;
    document.getElementById('outCandidates').textContent = `${d.demCandidate} (D) vs. ${d.repCandidate} (R)`;

    // Math additions stack
    applyFormat('outPartisanship', d.baseline);
    applyFormat('outGeneric', d.generic);
    applyFormat('outIncumbency', d.incumbency);
    applyFormat('outCandidatePerf', d.candidatePerf);
    applyFormat('outFinance', d.finance);

    // Sum / Projection
    applyFormat('outMargin', d.margin);
    
    // Auxiliary stats
    const stdevNum = parseFloat(d.stdev);
    document.getElementById('outStdev').textContent = `±${(stdevNum * 100).toFixed(1)} pts`;

    const winProbNum = parseFloat(d.winChance);
    const winProbElem = document.getElementById('outWinProb');
    const winPercent = Math.round(winProbNum * 100);
    winProbElem.textContent = `${winPercent}%`;
    winProbElem.style.color = winPercent >= 50 ? 'var(--dem)' : 'var(--rep)';

    card.style.display = 'block';
  });
</script>
